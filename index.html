<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>❤️</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(#f8bbd0, #fde4ec);
  overflow: hidden;
}

.scene {
  position: relative;
  width: 100%;
  height: 100%;
}

/* WALKING CONTAINER */
.penguin-walk {
  position: absolute;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%) scale(0.3);
  animation: moveForward 6s ease-in-out forwards;
}

/* PENGUIN */
.penguin {
  position: relative;
  width: 140px;
  animation: bodyWaddle 0.6s infinite alternate;
}

/* BODY */
.body {
  width: 140px;
  height: 180px;
  background: #222;
  border-radius: 70px 70px 55px 55px;
  position: relative;
}

.belly {
  width: 85px;
  height: 120px;
  background: #fff;
  border-radius: 42px;
  position: absolute;
  bottom: 20px;
  left: 28px;
}

/* FACE */
.eye {
  width: 10px;
  height: 10px;
  background: black;
  border-radius: 50%;
  position: absolute;
  top: 50px;
}

.eye.left { left: 45px; }
.eye.right { right: 45px; }

.beak {
  width: 18px;
  height: 14px;
  background: orange;
  border-radius: 0 0 8px 8px;
  position: absolute;
  top: 65px;
  left: 61px;
}

/* FLIPPERS */
.flipper {
  width: 45px;
  height: 18px;
  background: #222;
  border-radius: 20px;
  position: absolute;
  top: 85px;
}

.flipper.left {
  left: -28px;
  transform: rotate(20deg);
}

.flipper.right {
  right: -28px;
  transform-origin: left center;
  animation: giveRose 2s ease forwards;
  animation-delay: 6s;
}

/* LEGS */
.legs {
  position: absolute;
  bottom: -22px;
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 0 35px;
}

.leg {
  width: 18px;
  height: 25px;
  background: orange;
  border-radius: 8px;
}

.leg.left {
  animation: legWalk 0.6s infinite;
}

.leg.right {
  animation: legWalk 0.6s infinite reverse;
}

/* ROSE */
.rose {
  display: none;
  position: absolute;
  right: -70px;
  top: -25px;
  font-size: 50px;
}

/* ANIMATIONS */
@keyframes moveForward {
  from {
    transform: translateX(-50%) scale(0.3);
  }
  to {
    transform: translateX(-50%) scale(1);
  }
}

@keyframes bodyWaddle {
  from { transform: rotate(-4deg); }
  to { transform: rotate(4deg); }
}

@keyframes legWalk {
  from { transform: translateY(0); }
  to { transform: translateY(8px); }
}

@keyframes giveRose {
  to {
    transform: rotate(-25deg) translateX(25px);
  }
}
</style>
</head>

<body>

<div class="scene">
  <div class="penguin-walk">
    <div class="penguin">
      <div class="body">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="beak"></div>
        <div class="belly"></div>

        <div class="flipper left"></div>
        <div class="flipper right">
          <span class="rose" id="rose">🌹</span>
        </div>
      </div>

      <div class="legs">
        <div class="leg left"></div>
        <div class="leg right"></div>
      </div>
    </div>
  </div>
</div>

<script>
  setTimeout(() => {
    document.getElementById("rose").style.display = "inline";
  }, 6000);
</script>

</body>
</html>
