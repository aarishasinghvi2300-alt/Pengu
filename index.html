<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>❤️</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(#f8bbd0, #fde4ec);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: flex-end;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* WALKING CONTAINER */
  .penguin-walk {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%) scale(0.3);
    animation: walkForward 6s ease-in-out forwards;
  }

  /* PENGUIN BODY */
  .penguin {
    position: relative;
    width: 120px;
    height: 160px;
    animation: waddle 0.5s infinite alternate;
  }

  .body {
    width: 120px;
    height: 160px;
    background: #2c2c2c;
    border-radius: 60px 60px 50px 50px;
    position: relative;
  }

  .belly {
    width: 70px;
    height: 100px;
    background: white;
    border-radius: 35px;
    position: absolute;
    bottom: 15px;
    left: 25px;
  }

  .eye {
    width: 8px;
    height: 8px;
    background: black;
    border-radius: 50%;
    position: absolute;
    top: 40px;
  }

  .eye.left { left: 40px; }
  .eye.right { right: 40px; }

  .beak {
    width: 14px;
    height: 10px;
    background: orange;
    border-radius: 0 0 6px 6px;
    position: absolute;
    top: 55px;
    left: 53px;
  }

  /* FLIPPERS */
  .flipper {
    width: 35px;
    height: 15px;
    background: #2c2c2c;
    border-radius: 20px;
    position: absolute;
    top: 75px;
  }

  .flipper.left {
    left: -20px;
    transform: rotate(20deg);
  }

  .flipper.right {
    right: -20px;
    transform-origin: left center;
    animation: giveRose 2s ease forwards;
    animation-delay: 6s;
  }

  /* ROSE */
  .rose {
    display: none;
    position: absolute;
    right: -45px;
    top: -10px;
    font-size: 28px;
  }

  /* ANIMATIONS */
  @keyframes walkForward {
    0% {
      transform: translateX(-50%) scale(0.3);
    }
    100% {
      transform: translateX(-50%) scale(1);
    }
  }

  @keyframes waddle {
    0% { transform: rotate(-5deg); }
    100% { transform: rotate(5deg); }
  }

  @keyframes giveRose {
    to {
      transform: rotate(-20deg) translateX(20px);
    }
  }
</style>
</head>

<body>

<div class="scene">
  <div class="penguin-walk">
    <div class="penguin">
      <div class="body">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="beak"></div>
        <div class="belly"></div>

        <div class="flipper left"></div>
        <div class="flipper right">
          <span class="rose" id="rose">🌹</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  setTimeout(() => {
    document.getElementById("rose").style.display = "inline";
  }, 6000);
</script>

</body>
</html>
